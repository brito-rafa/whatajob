# This rule is not used by the project whatajob itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the whatajob.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: whatajob
    app.kubernetes.io/managed-by: kustomize
  name: billybob-editor-role
rules:
- apiGroups:
  - whatajob.io
  resources:
  - billybobs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - whatajob.io
  resources:
  - billybobs/status
  verbs:
  - get
